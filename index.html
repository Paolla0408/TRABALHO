<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciamento de Produtos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Gerenciamento de Produtos</h1>

    <section>
        <h2>Listar bebidas</h2>

        <button onclick="listarBebidas()">
            Mostrar bebidas
        </button>

        <div id="listaBebidas"></div>
    </section>


    <section>
        <h2>Cadastrar novo produto</h2>

        <form id="formProduto">

            <label for="nome">
                Nome:
            </label>

            <input
                type="text"
                id="nome"
                required
            >


            <label for="preco">
                Preço:
            </label>

            <input
                type="number"
                id="preco"
                step="0.01"
                required
            >


            <label for="categoria">
                Categoria:
            </label>

            <select id="categoria" required>

                <option value="">
                    Selecione uma categoria
                </option>

                <option value="Bebidas">
                    Bebidas
                </option>

                <option value="Alimentos">
                    Alimentos
                </option>

                <option value="Higiene">
                    Higiene
                </option>

                <option value="Limpeza">
                    Limpeza
                </option>

            </select>


            <label for="estoque">
                Estoque:
            </label>

            <input
                type="number"
                id="estoque"
                required
            >


            <button type="submit">
                Adicionar produto
            </button>

        </form>

        <p id="mensagem"></p>

    </section>


    <script src="script.js"></script>

</body>

</html>
